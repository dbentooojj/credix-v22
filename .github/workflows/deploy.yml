name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space on runner
        run: |
          set -euxo pipefail
          echo "Disk before cleanup:"
          df -h
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/.ghcup || true
          docker system prune -af || true
          echo "Disk after cleanup:"
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/credix-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/credix-backend:${{ github.sha }}

      - name: Prune Buildx cache after backend build
        run: docker buildx prune -af || true

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/credix-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/credix-frontend:${{ github.sha }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -e
            if [ -d "$HOME/credix" ]; then
              cd "$HOME/credix"
            elif [ -d "/opt/credix" ]; then
              cd "/opt/credix"
            else
              echo "Diretorio do projeto nao encontrado (esperado: $HOME/credix ou /opt/credix)."
              exit 1
            fi

            print_disk() {
              echo "=== $1 ==="
              df -h
              docker system df || true
            }

            print_disk "ANTES DA LIMPEZA"
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            # Limpeza segura: sem remover volumes do PostgreSQL.
            docker container prune -f || true
            docker image prune -af || true
            docker builder prune -af || true
            docker network prune -f || true

            print_disk "APOS LIMPEZA PRE-DEPLOY"

            # Atualiza por servico para reduzir pico de uso de disco.
            docker compose pull backend
            docker compose up -d backend

            # Remove imagens/cache nao referenciados antes de puxar o frontend.
            docker image prune -af || true
            docker builder prune -af || true

            print_disk "APOS ATUALIZAR BACKEND"

            docker compose pull frontend
            docker compose up -d frontend

            # Limpeza final segura, sem --volumes.
            docker container prune -f || true
            docker image prune -af || true
            docker builder prune -af || true
            docker network prune -f || true

            print_disk "APOS DEPLOY"
            docker compose ps
