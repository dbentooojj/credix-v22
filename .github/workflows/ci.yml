name: Validar aplicação

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Testes e builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Gerar Prisma Client
        run: npm run prisma:generate --workspace backend

      - name: Validar seed de produção
        run: npx tsc --noEmit --target ES2022 --module commonjs --moduleResolution node --esModuleInterop --strict backend/prisma/seed-production.ts

      - name: Validar scripts de produção
        run: |
          bash -n ops/bootstrap-vps.sh
          bash -n ops/deploy-production.sh
          bash -n ops/generate-production-env.sh
          IMAGE_NAMESPACE=dbentooojj IMAGE_TAG=validation docker compose --env-file ops/production.env.example -f docker-compose.production.yml config --quiet
          docker run --rm -e CADDY_EMAIL=admin@credix.app.br -v "$PWD/ops/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          bash ops/tests/deploy-production.test.sh
          bash ops/tests/generate-production-env.test.sh

      - name: Testar backend
        run: npm test --workspace backend

      - name: Compilar backend
        run: npm run build --workspace backend

      - name: Compilar frontend
        run: npm run build --workspace frontend
