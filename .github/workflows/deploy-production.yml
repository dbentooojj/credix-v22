name: Publicar em produção

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: Digite PRODUCAO para confirmar o deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: credix-production
  cancel-in-progress: false

env:
  BACKEND_IMAGE: dbentooooojj/credix-backend
  FRONTEND_IMAGE: dbentooooojj/credix-frontend
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  validate:
    name: Validar versão
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Exigir branch principal
        if: github.ref != 'refs/heads/main'
        run: |
          echo "O deploy de produção só pode ser executado pela branch main."
          exit 1

      - name: Confirmar publicação
        if: inputs.confirmacao != 'PRODUCAO'
        run: |
          echo "Confirmação inválida. Digite PRODUCAO para publicar."
          exit 1

      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Gerar Prisma Client
        run: npm run prisma:generate --workspace backend

      - name: Executar testes
        run: npm test --workspace backend

      - name: Compilar aplicação
        run: npm run build

  publish:
    name: Criar imagens Docker
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Entrar no Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publicar backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Publicar frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Atualizar VPS
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Validar configuração da VPS
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_PATH: ${{ secrets.PROD_PATH }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN PROD_HOST PROD_USER PROD_PORT PROD_PATH PROD_SSH_KEY PROD_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "Secret obrigatório ausente: $name"
              exit 1
            fi
          done

      - name: Configurar conexão segura
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$PROD_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Preparar diretório da aplicação
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_PATH: ${{ secrets.PROD_PATH }}
        run: ssh -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" "mkdir -p '$PROD_PATH'"

      - name: Autenticar Docker Hub na VPS
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | ssh -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" "docker login -u '$DOCKERHUB_USERNAME' --password-stdin"

      - name: Enviar configuração do deploy
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_PATH: ${{ secrets.PROD_PATH }}
        run: scp -P "$PROD_PORT" docker-compose.yml "$PROD_USER@$PROD_HOST:$PROD_PATH/docker-compose.yml.next"

      - name: Publicar versão e verificar saúde
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_PATH: ${{ secrets.PROD_PATH }}
        run: ssh -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" "bash -s -- '$PROD_PATH' '${{ github.sha }}' '$DOCKERHUB_USERNAME'" < ops/deploy-production.sh
